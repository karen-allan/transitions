<ng-container *ngIf="patient">
    <div class="print-form-header">
        <div class="print-form-logo">
            <img src="../../../../assets/images/details/consultations/bookConsultation/transInEnergyLogo.jpg"
                 title="write your care guide wish list"
                 alt="write your care guide wish list">
        </div>

        <div class="print-form-text">
            <h1>Client Intake Form</h1>
            <h2>My Need for Support as Patient</h2>
            <h3>{{now}}</h3>
        </div>
    </div>
</ng-container>

<ng-container *ngIf="planner">
    <div class="print-form-header">
        <div class="print-form-logo">
            <img src="../../../../assets/images/details/consultations/bookConsultation/transInEnergyLogo.jpg"
                 title="write your care guide wish list"
                 alt="write your care guide wish list">
        </div>

        <div class="print-form-text">
            <h1>Client Intake Form</h1>
            <h2>Planning for Your Future Care</h2>
            <h3>{{now}}</h3>
        </div>
    </div>
</ng-container>

<ng-container *ngIf="caregiver">
    <div class="print-form-header">
        <div class="print-form-logo">
            <img src="../../../../assets/images/details/consultations/bookConsultation/transInEnergyLogo.jpg"
                 title="write your care guide wish list"
                 alt="write your care guide wish list">
        </div>

        <div class="print-form-text">
            <h1>Client Intake Form</h1>
            <h2>My Need for Support as Caregiver</h2>
            <h3>{{now}}</h3>
        </div>
    </div>
</ng-container>
